name: Update star history

on:
  schedule:
    # Pick a non-round minute to avoid the busiest part of the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate star history
        uses: kernalix7/GH-Star-History-for-Actions@main
        with:
          github-token: ${{ github.token }}

      - name: Commit generated history
        shell: bash
        run: |
          if git diff --quiet -- .github/star-history; then
            echo "No star history changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/star-history
          git commit -m "chore: update star history"
          git push
