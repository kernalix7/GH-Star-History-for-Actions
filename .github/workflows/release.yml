name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the release tag to a full commit SHA."
            exit 1
          fi

          previous_tag="$(
            git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true
          )"
          if test -n "${previous_tag}"; then
            commit_range="${previous_tag}..${release_sha}"
          else
            commit_range="${release_sha}"
          fi

          changes="$(
            while IFS=$'\t' read -r subject short_sha full_sha; do
              if test "${subject}" = "chore: update star history"; then
                continue
              fi
              printf -- \
                '- %s ([`%s`](https://github.com/%s/commit/%s))\n' \
                "${subject}" "${short_sha}" "${REPOSITORY}" "${full_sha}"
            done < <(
              git log --no-merges \
                --pretty=tformat:'%s%x09%h%x09%H' \
                "${commit_range}"
            )
          )"
          if test -z "${changes}"; then
            changes="- No user-facing commits were recorded for this release."
          fi

          export RELEASE_SHA="${release_sha}"
          export CHANGES="${changes}"
          release_notes="$(
            node scripts/render-release-notes.mjs \
              .github/release-notes-template.md
          )"

          gh release create "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --title "${RELEASE_TAG}" \
            --notes "${release_notes}"
