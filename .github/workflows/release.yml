name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the release tag to a full commit SHA."
            exit 1
          fi

          release_notes="$(
            printf '%s\n' \
              '## Pin this release' \
              '' \
              'Full commit SHA:' \
              '' \
              '```text' \
              "${release_sha}" \
              '```' \
              '' \
              'Use this exact version in a target repository:' \
              '' \
              '```yaml' \
              "uses: ${REPOSITORY}/.github/workflows/reusable-star-history.yml@${release_sha}" \
              '```' \
              '' \
              'The install template intentionally continues to use `@main` for automatic updates.' \
              'Replace only its ref when you intentionally want to pin a target repository.'
          )"

          gh release create "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --title "${RELEASE_TAG}" \
            --notes "${release_notes}"
